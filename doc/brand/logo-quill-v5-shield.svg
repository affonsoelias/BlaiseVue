<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGoldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="crestDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0B0F19" />

  <g filter="url(#crestGlow)">
    <!-- Outer Shield-Feather Perimeter -->
    <path d="M 256, 50 
             C 380, 50 430, 110 430, 200 
             C 430, 310 330, 395 256, 448 
             C 182, 395 82, 310 82, 200 
             C 82, 110 132, 50 256, 50 Z" 
          fill="url(#crestDark)" 
          stroke="url(#crestGoldCyan)" 
          stroke-width="8" />

    <!-- Feather Serrations (Barbs carved into the sides) -->
    <path d="M 120, 170 L 170, 155 L 140, 220 L 195, 205 L 170, 270 L 225, 260 L 256, 380" 
          stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 392, 170 L 342, 155 L 372, 220 L 317, 205 L 342, 270 L 287, 260 L 256, 380" 
          stroke="#00E676" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- The Great Golden-Cyan Fountain Pen Nib -->
    <polygon points="256,110 320,290 256,410 192,290" 
             fill="url(#crestGoldCyan)" />

    <!-- Inverted V Chevron in Nib -->
    <polygon points="256,150 292,250 256,220 220,250" fill="#0F172A" />

    <!-- Nib Breather Hole & Ink Slit -->
    <circle cx="256" cy="300" r="8" fill="#FFFFFF" />
    <line x1="256" y1="308" x2="256" y2="408" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Reactive Ink Dot -->
    <circle cx="256" cy="425" r="5" fill="#00E676" />
  </g>
</svg>
