<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glowQuill" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0B0F19" />

  <!-- The Cyber Quill & 'V' Formation -->
  <g transform="translate(0, 10)">
    <!-- Left Feather Wing (Stylized Pascal Quill Barbs) -->
    <path d="M 256, 70 
             C 170, 120 120, 200 120, 290 
             C 120, 310 125, 330 135, 350 
             L 180, 320 
             C 175, 305 170, 290 170, 270 
             C 170, 210 205, 155 256, 120 Z" 
          fill="#0284C7" 
          opacity="0.8" />

    <path d="M 256, 130 
             C 210, 170 180, 230 180, 290 
             C 180, 320 190, 345 205, 365 
             L 240, 340 
             C 230, 325 225, 305 225, 285 
             C 225, 240 240, 195 256, 165 Z" 
          fill="#00D2FF" 
          opacity="0.9" />

    <!-- Right Wing of 'V' (Sharp Blade of Modern Tech) -->
    <path d="M 256, 70 
             L 370, 280 
             L 310, 280 
             L 256, 175 Z" 
          fill="url(#quillGrad)" />

    <!-- Center Spine & Nib (Sharp Pen Vertex pointing down) -->
    <path d="M 256, 160 
             L 285, 360 
             L 256, 420 
             L 227, 360 Z" 
          fill="url(#nibGrad)" 
          filter="url(#glowQuill)" />

    <!-- Ink Slit of the Nib -->
    <line x1="256" y1="260" x2="256" y2="395" stroke="#0B0F19" stroke-width="4" stroke-linecap="round" />

    <!-- Radiating Ink Point (The Spark of Reactivity) -->
    <circle cx="256" cy="438" r="8" fill="#00E676" filter="url(#glowQuill)" />
  </g>
</svg>
