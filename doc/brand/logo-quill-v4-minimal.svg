<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="origamiLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="origamiRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="origamiCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="origamiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0B0F19" />

  <g filter="url(#origamiShadow)" transform="translate(0, 5)">
    <!-- Left Geometric Feather Blade (Pascal Strength) -->
    <polygon points="256,70 120,200 170,330 256,410 246,250" fill="url(#origamiLeft)" />

    <!-- Right Geometric Feather Blade (Vue Reactivity) -->
    <polygon points="256,70 392,200 342,330 256,410 266,250" fill="url(#origamiRight)" />

    <!-- Top Inverted Triangle Cutout forming a bold 'V' -->
    <polygon points="256,150 320,80 192,80" fill="#0B0F19" />

    <!-- Pure Minimal Nib Inscribed in Negative Space -->
    <polygon points="256,170 286,340 256,424 226,340" fill="url(#origamiCore)" />

    <!-- Razor Thin Center Ink Slit -->
    <line x1="256" y1="260" x2="256" y2="420" stroke="#0B0F19" stroke-width="5" stroke-linecap="round" />
    <circle cx="256" cy="260" r="6" fill="#0B0F19" />

    <!-- Droplet Accent -->
    <polygon points="256,440 264,452 256,464 248,452" fill="#00E676" />
  </g>
</svg>
