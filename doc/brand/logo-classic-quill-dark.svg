<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="darkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0B0F19" />
  <circle cx="256" cy="256" r="216" fill="#131B2E" stroke="#334155" stroke-width="4" />

  <g filter="url(#darkGlow)" transform="translate(15, -10)">
    <!-- THE PURE CRISP WHITE FEATHER QUILL -->
    <path d="M 230, 390 
             L 345, 120 
             C 360, 80 405, 60 435, 75 
             C 445, 110 400, 175 355, 235 
             L 295, 305 Z" 
          fill="#FFFFFF" 
          stroke="#CBD5E1" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Feather Barbs (Gravura Fina Cinza/Preto) -->
    <g stroke="#0F172A" stroke-width="2.5" stroke-linecap="round">
      <line x1="330" y1="160" x2="385" y2="120" />
      <line x1="338" y1="180" x2="400" y2="140" />
      <line x1="345" y1="200" x2="410" y2="160" />
      <line x1="350" y1="220" x2="395" y2="190" />
      <line x1="340" y1="245" x2="380" y2="225" />
      <line x1="320" y1="275" x2="355" y2="255" />

      <!-- Left Vane Barbs -->
      <line x1="310" y1="190" x2="275" y2="170" />
      <line x1="295" y1="225" x2="265" y2="205" />
      <line x1="280" y1="260" x2="255" y2="245" />
    </g>

    <!-- Center Feather Shaft -->
    <line x1="230" y1="390" x2="420" y2="80" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />

    <!-- White Nib Tip -->
    <polygon points="230,390 248,340 216,355" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <line x1="230" y1="390" x2="238" y2="368" stroke="#0F172A" stroke-width="2.5" />
    <circle cx="228" cy="394" r="5" fill="#FFFFFF" />

    <!-- THE DARK BLACK HAND WITH FINE SILVER CONTOURS -->
    <!-- Forearm and Cuff -->
    <path d="M 90, 480 
             C 120, 430 160, 395 190, 380 
             L 245, 365 
             C 275, 365 305, 385 340, 435 
             L 370, 480 Z" 
          fill="#020617" 
          stroke="#475569" 
          stroke-width="3" />

    <!-- Index Finger -->
    <path d="M 195, 380 
             C 190, 345 205, 320 230, 315 
             C 255, 310 280, 328 275, 360 
             C 270, 385 245, 390 225, 388 Z" 
          fill="#020617" 
          stroke="#64748B" 
          stroke-width="3" />

    <!-- Thumb -->
    <path d="M 175, 400 
             C 180, 370 205, 365 220, 375 
             C 232, 385 228, 410 205, 415 
             C 185, 420 173, 412 175, 400 Z" 
          fill="#000000" 
          stroke="#94A3B8" 
          stroke-width="2.5" />

    <!-- Knuckle and Finger Highlights -->
    <path d="M 210, 345 C 225, 340 245, 345 255, 360" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 195, 385 C 205, 380 215, 385 220, 395" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

    <!-- Classic 17th Century Ruffled Cuff in Pure White -->
    <path d="M 95, 480 C 130, 455 190, 455 225, 480" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" />
    <path d="M 105, 488 C 135, 465 185, 465 215, 488" 
          fill="none" 
          stroke="#94A3B8" 
          stroke-width="3" 
          stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="256" y="470" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="bold" fill="#E2E8F0" letter-spacing="4">BLAISEVUE</text>
</svg>
