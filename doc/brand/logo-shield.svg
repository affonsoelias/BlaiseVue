<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Reactive Core Gradient (Cyan to Emerald) -->
    <linearGradient id="reactiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Pascal Royal Accent -->
    <linearGradient id="pascalAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="shieldShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Protective Shield (Type Safety & Architecture) -->
  <g filter="url(#shieldShadow)">
    <path d="M 256, 44 
             C 368, 44 436, 88 436, 172 
             C 436, 312 344, 404 256, 468 
             C 168, 404 76, 312 76, 172 
             C 76, 88 144, 44 256, 44 Z" 
          fill="url(#shieldGradDark)" 
          stroke="url(#pascalAccent)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Left Facet (Echoing the curve of 'B' for Blaise) -->
    <path d="M 256, 44 
             C 144, 44 76, 88 76, 172 
             C 76, 312 168, 404 256, 468 
             L 256, 210 Z" 
          fill="#334155" 
          opacity="0.2" />

    <!-- Stylized 'B' Spine Detail -->
    <path d="M 170, 140 
             L 170, 340 
             C 210, 340 236, 320 236, 290 
             C 236, 265 215, 245 195, 240 
             C 215, 235 230, 215 230, 190 
             C 230, 160 205, 140 170, 140 Z" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="6" 
          opacity="0.15" />

    <!-- The Great Reactive 'V' (Vue Engine & Energy) -->
    <path d="M 148, 148 
             L 256, 372 
             L 364, 148 
             L 308, 148 
             L 256, 272 
             L 204, 148 Z" 
          fill="url(#reactiveGrad)" 
          filter="url(#neonGlow)" />

    <!-- Inner Core Prism (Speed & Type-Check Focal Vertex) -->
    <polygon points="256,312 284,248 228,248" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
