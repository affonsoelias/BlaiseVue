<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Classic Shadow -->
    <filter id="classicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean Circular Seal / Medallion (Off-White Parchment / Light Grey for maximum contrast) -->
  <rect width="512" height="512" rx="96" fill="#F1F5F9" />
  <circle cx="256" cy="256" r="216" fill="#FFFFFF" stroke="#0F172A" stroke-width="6" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <g filter="url(#classicShadow)" transform="translate(15, -10)">
    <!-- THE PURE WHITE FEATHER QUILL (A Pena Branca) -->
    <!-- Feather Silhouette -->
    <path d="M 230, 390 
             L 345, 120 
             C 360, 80 405, 60 435, 75 
             C 445, 110 400, 175 355, 235 
             L 295, 305 Z" 
          fill="#FFFFFF" 
          stroke="#0F172A" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Feather Barbs & Vane Details (Gravação Clássica em Preto Fino) -->
    <g stroke="#0F172A" stroke-width="2.5" stroke-linecap="round">
      <line x1="330" y1="160" x2="385" y2="120" />
      <line x1="338" y1="180" x2="400" y2="140" />
      <line x1="345" y1="200" x2="410" y2="160" />
      <line x1="350" y1="220" x2="395" y2="190" />
      <line x1="340" y1="245" x2="380" y2="225" />
      <line x1="320" y1="275" x2="355" y2="255" />

      <!-- Left Vane Barbs -->
      <line x1="310" y1="190" x2="275" y2="170" />
      <line x1="295" y1="225" x2="265" y2="205" />
      <line x1="280" y1="260" x2="255" y2="245" />
    </g>

    <!-- Center Feather Shaft (Rachis da Pena) -->
    <line x1="230" y1="390" x2="420" y2="80" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

    <!-- Pure White Nib (Ponta da Pena de Tinteiro) -->
    <polygon points="230,390 248,340 216,355" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
    <line x1="230" y1="390" x2="238" y2="368" stroke="#0F172A" stroke-width="3" />

    <!-- Ink Dot at the Nib Tip -->
    <circle cx="228" cy="394" r="5" fill="#0F172A" />

    <!-- THE DARK BLACK HAND (A Mão Escura/Preta Segurando a Pena) -->
    <!-- Forearm and Cuff -->
    <path d="M 90, 480 
             C 120, 430 160, 395 190, 380 
             L 245, 365 
             C 275, 365 305, 385 340, 435 
             L 370, 480 Z" 
          fill="#0F172A" 
          stroke="#000000" 
          stroke-width="4" />

    <!-- Index Finger (Curved around the white quill) -->
    <path d="M 195, 380 
             C 190, 345 205, 320 230, 315 
             C 255, 310 280, 328 275, 360 
             C 270, 385 245, 390 225, 388 Z" 
          fill="#0F172A" 
          stroke="#1E293B" 
          stroke-width="3" />

    <!-- Thumb (Delicately pinching the front of the white quill) -->
    <path d="M 175, 400 
             C 180, 370 205, 365 220, 375 
             C 232, 385 228, 410 205, 415 
             C 185, 420 173, 412 175, 400 Z" 
          fill="#020617" 
          stroke="#334155" 
          stroke-width="2" />

    <!-- Knuckle and Finger Separation Highlights (Gravura Fina) -->
    <path d="M 210, 345 C 225, 340 245, 345 255, 360" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M 195, 385 C 205, 380 215, 385 220, 395" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Classic 17th Century Ruffled Cuff (Gola/Punho de Camisa Clássica de Época) -->
    <path d="M 95, 480 C 130, 455 190, 455 225, 480" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" />
    <path d="M 105, 488 C 135, 465 185, 465 215, 488" 
          fill="none" 
          stroke="#CBD5E1" 
          stroke-width="3" 
          stroke-linecap="round" />
  </g>

  <!-- Classic Latin / Philosophical Motto Ribbon (Opcional) -->
  <text x="256" y="468" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="20" font-weight="bold" fill="#0F172A" letter-spacing="4">BLAISEVUE</text>
</svg>
