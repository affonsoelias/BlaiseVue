name: Release BlaiseVue

on:
  push:
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable or nightly)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - nightly

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      - name: Install Free Pascal on macOS
        if: runner.os == 'macOS'
        run: |
          brew install fpc

      - name: Install Free Pascal on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command fpc -ErrorAction SilentlyContinue)) {
            choco install lazarus -y --no-progress
            $fpcDir = Get-ChildItem "C:\lazarus\fpc" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
            if ($fpcDir) { "$fpcDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }

      - name: Build and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\bv.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseVer = if ($pkg.version) { [string]$pkg.version } else { "0.1.0" }
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) {
            $ver = $tag.Substring(1)
          } elseif ("${{ github.event_name }}" -eq "schedule" -or "${{ inputs.channel }}" -eq "nightly") {
            $dateStamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
            $ver = "$baseVer-nightly.$dateStamp"
          } else {
            $ver = $baseVer
          }
          powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1 -Version $ver -OutDir dist -SkipBuild

      - name: Build and package on Linux / macOS
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh scripts/package_release.sh
          ./build.sh
          ./bin/bv --version
          BASE_VER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1 || true)"
          BASE_VER="${BASE_VER:-0.1.0}"
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
          elif [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            VER="${BASE_VER}-nightly.$(date -u +%Y%m%d)"
          else
            VER="$BASE_VER"
          fi
          ./scripts/package_release.sh --version="$VER" --out-dir=dist --skip-build

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate release files & SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release-files/ \;
          cat artifacts/**/SHA256SUMS.txt > release-files/SHA256SUMS.txt

      - name: Determine release tag
        id: meta
        run: |
          BASE_VER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1 || true)"
          BASE_VER="${BASE_VER:-0.1.0}"
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "name=BlaiseVue Nightly (main)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=BlaiseVue ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${BASE_VER}" >> $GITHUB_OUTPUT
            echo "name=BlaiseVue v${BASE_VER}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-files/*
